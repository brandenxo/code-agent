<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Code Agent</h2>

                <button id="newChatButton" type="button">
                    + New Chat
                </button>
            </div>

            <div class="sidebar-section">
                <p class="sidebar-label">Recent</p>
                <div id="chatList"></div>
            </div>
        </aside>

        <div class="app">
            <header class="topbar">
                <div>
                    <h1>Code Agent</h1>
                    <p>AI coding assistant</p>
                </div>

                <nav class="view-nav" aria-label="Main navigation">
                    <button id="chatTab" type="button" aria-pressed="true">Chat</button>
                    <button id="benchmarksTab" type="button" aria-pressed="false">Benchmarks</button>
                </nav>

                <div class="model-box" id="modelBox">
                    <span>Model</span>
                    <select id="modelSelect">
                        <option value="auto">Auto</option>
                        <option value="nvidia/nemotron-3-ultra-550b-a55b:free">
                            Nemotron 3 Ultra
                        </option>
                        <option value="poolside/laguna-s-2.1:free">
                            Laguna S 2.1
                        </option>
                        <option value="cohere/north-mini-code:free">
                            North Mini Code
                        </option>
                    </select>
                </div>
            </header>

            <main class="chat" id="chatView">
                <div id="messages" class="messages"></div>

                <div class="input-area">
                    <textarea
                        id="promptInput"
                        placeholder="Ask Code Agent..."
                    ></textarea>

                    <button id="sendButton" type="button">
                        Send
                    </button>
                </div>
            </main>
            <main id="benchmarksView" class="benchmarks-view" hidden>
                <div class="benchmark-heading">
                    <div><h2>Model comparison</h2><p>Internal measurements and current Auto preferences</p></div>
                    <button id="refreshBenchmarks" type="button">Refresh</button>
                </div>
                <p id="benchmarkStatus" role="status" aria-live="polite"></p>
                <div id="benchmarkContent"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
